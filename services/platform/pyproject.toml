[project]
name = "platform-service"
version = "0.1.0"
description = "公共层 D：身份与权限、空间与座位主数据、通知、审计"
requires-python = "==3.12.*"
dependencies = [
    "argon2-cffi>=23.1",
    "campus-common",
]

[tool.uv.sources]
campus-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_service"]

# uv 工作区根。各服务（services/*）与公共库（libs/*）是独立的 Python 包，
# 在这里统一锁定依赖、统一配置代码检查与测试。根项目本身不打包、不安装。

[project]
name = "campus-resource-hub"
version = "0.0.0"
description = "校园资源服务平台 · uv 工作区根"
requires-python = "==3.12.*"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

# ---------- Ruff：代码检查与格式化 ----------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import 排序
    "N",        # 命名
    "UP",       # 新语法
    "B",        # 常见缺陷
    "SIM",      # 可简化写法
    "RUF",      # Ruff 自带规则
    "ASYNC",    # 异步代码中的阻塞调用（AGENTS.md：统一异步）
    "DTZ",      # 禁止不带时区的 datetime（AGENTS.md：存储带时区）
    "S",        # 安全
    "PT",       # pytest 写法
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]  # 测试中允许 assert

# ---------- mypy：类型检查 ----------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["libs", "services"]
namespace_packages = true
explicit_package_bases = true

# ---------- pytest ----------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "services"]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = [
    "integration: 依赖 Docker（Testcontainers）的集成测试",
]

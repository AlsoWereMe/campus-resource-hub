# 本地网关（架构 §4.2）：按路径前缀转发到各服务；/internal/** 一律 404；其余转给前端开发服务器。
# 用变量 + resolver 让 nginx 在上游未就绪时也能启动。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 20m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header traceparent $http_traceparent;

    location /internal/ {
        return 404;
    }

    location ~ ^/api/(iam|space|notify|audit)/ {
        set $upstream http://platform:8000;
        proxy_pass $upstream;
    }

    location /api/m1/ {
        set $upstream http://seat:8000;
        proxy_pass $upstream;
    }

    location /api/m2/ {
        set $upstream http://room:8000;
        proxy_pass $upstream;
    }

    location /api/m3/ {
        set $upstream http://repair:8000;
        proxy_pass $upstream;
    }

    # 前端：开发时由宿主机上的 pnpm dev（端口 3000）提供，支持热更新
    location / {
        set $web http://host.docker.internal:3000;
        proxy_pass $web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

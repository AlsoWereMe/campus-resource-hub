# 持续集成：每个合并请求与每次推送 main 自动检查（任务书「质量门禁」：测试不过不能合并）。
# backend、frontend 两项是 main 的必过检查，内容与本地 make check 相同，
# 另加前端生成类型一致性检查与静态构建。任一步失败，后续步骤不再执行。
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.11"
          enable-cache: true
      - name: 安装依赖（锁文件必须最新）
        run: uv sync --all-packages --locked
      - name: 代码检查
        run: make lint
      - name: 类型检查
        run: make typecheck
      - name: 契约与代码一致
        run: make contracts-check
      - name: 测试（Testcontainers 起真实 PostgreSQL）
        run: make test

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 前端类型与契约一致
        run: pnpm gen:api && git diff --exit-code -- src/shell/api/types
      - name: 类型检查
        run: pnpm typecheck
      - name: 单元测试
        run: pnpm test
      - name: 静态构建
        run: pnpm build

    put:
      tags:
      - M1 · 内部接口
      summary: 写入或更新占用块（M1-INT-01、03）
      description: 以「写入来源 + 来源单号」幂等。ACTIVE 取消冲突的个人预约并通知（不计违约，BR-19），HOLD 只阻止新预约。仅 M3_REPAIR、ADMIN 可不填结束时间。

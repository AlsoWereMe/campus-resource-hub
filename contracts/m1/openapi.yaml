components:
  schemas:
    AdminBooking:
      properties:
        id:
          type: integer
          title: Id
        seatId:
          type: integer
          title: Seatid
        seatCode:
          type: string
          title: Seatcode
        roomId:
          type: integer
          title: Roomid
        roomName:
          type: string
          title: Roomname
        buildingName:
          type: string
          title: Buildingname
        startsAt:
          type: string
          format: date-time
          title: Startsat
        endsAt:
          type: string
          format: date-time
          title: Endsat
        status:
          $ref: '#/components/schemas/BookingStatus'
        createdAt:
          type: string
          format: date-time
          title: Createdat
        checkinOpensAt:
          type: string
          format: date-time
          title: Checkinopensat
          description: 签到窗口开启时刻（BR-13）
        checkinDeadline:
          type: string
          format: date-time
          title: Checkindeadline
          description: 签到截止时刻 T0 + 15 分钟（BR-12、13）
        checkedInAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Checkedinat
        checkinMethod:
          anyOf:
          - $ref: '#/components/schemas/CheckinMethod'
          - type: 'null'
        cancelledAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Cancelledat
        cancelReason:
          anyOf:
          - type: string
          - type: 'null'
          title: Cancelreason
        cancelSource:
          anyOf:
          - $ref: '#/components/schemas/BlockSource'
          - type: 'null'
          description: 系统取消时的写入来源
        cancelSourceRef:
          anyOf:
          - type: string
          - type: 'null'
          title: Cancelsourceref
        userId:
          type: integer
          title: Userid
        studentNoMasked:
          type: string
          title: Studentnomasked
          description: 运营管理员默认看到脱敏学号（NFR-11）
        studentName:
          anyOf:
          - type: string
          - type: 'null'
          title: Studentname
          description: 无查看完整信息的权限时为空
      type: object
      required:
      - id
      - seatId
      - seatCode
      - roomId
      - roomName
      - buildingName
      - startsAt
      - endsAt
      - status
      - createdAt
      - checkinOpensAt
      - checkinDeadline
      - userId
      - studentNoMasked
      title: AdminBooking
    BlockBrief:
      properties:
        source:
          $ref: '#/components/schemas/BlockSource'
        sourceRef:
          type: string
          title: Sourceref
        kind:
          $ref: '#/components/schemas/BlockKind'
        scope:
          $ref: '#/components/schemas/BlockScope'
        startsAt:
          type: string
          format: date-time
          title: Startsat
        endsAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Endsat
      type: object
      required:

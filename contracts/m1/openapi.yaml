        in: path
        required: true
        schema:
          type: string
          title: Source Ref
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockUpsert'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - M1 · 内部接口
      summary: 释放占用块（M1-INT-02）
      description: 幂等：释放不存在或已释放的块也返回 204。被取消的个人预约不自动恢复。

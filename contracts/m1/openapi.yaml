      security:
      - HTTPBearer: []
      parameters:
      - name: source
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/BlockSource'
      - name: source_ref
        in: path
        required: true
        schema:
          type: string
          title: Source Ref
      responses:
        '204':
          description: Successful Response
        '422':

openapi: 3.1.0
info:
  title: m1 API
  version: v1
paths:
  /api/m1/v1/rooms:
    get:
      tags:
      - M1 · 检索
      summary: 浏览可用自习室（M1-RSV-01）
      description: 只返回学生可见（院系专属仅本院系，BR-10）、已开放的自习室。
      operationId: browse_rooms_api_m1_v1_rooms_get
      security:
      - HTTPBearer: []
      parameters:
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: 默认今天（业务时区）
          title: Date
        description: 默认今天（业务时区）
      - name: startHour
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 23
            minimum: 0
          - type: 'null'
          description: 默认最近可约整点
          title: Starthour
        description: 默认最近可约整点
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          maximum: 12
          minimum: 1
          default: 1
          title: Hours
      - name: campusId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Campusid
      - name: buildingId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Buildingid
      - name: roomType
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/RoomType'
          - type: 'null'
          title: Roomtype
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomBrowseItem'
                title: Response Browse Rooms Api M1 V1 Rooms Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m1/v1/seats/search:
    get:
      tags:
      - M1 · 检索
      summary: 条件搜索座位（M1-SRH-01）
      description: 结果按自习室分组；标记多选须全部满足；P95 < 1 秒（NFR-14）。
      operationId: search_seats_api_m1_v1_seats_search_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: 页码，从 1 开始
          default: 1
          title: Page
        description: 页码，从 1 开始
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: 每页条数
          default: 20
          title: Size
        description: 每页条数
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: 默认今天（业务时区）
          title: Date
        description: 默认今天（业务时区）
      - name: startHour
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 23
            minimum: 0
          - type: 'null'
          description: 默认最近可约整点
          title: Starthour
        description: 默认最近可约整点
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          maximum: 12
          minimum: 1
          default: 1
          title: Hours
      - name: campusId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Campusid
      - name: buildingId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Buildingid
      - name: roomId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Roomid
      - name: roomType
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/RoomType'
          - type: 'null'
          title: Roomtype
      - name: tags
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: 多选须全部满足
          title: Tags
        description: 多选须全部满足
      - name: anyOutlet
        in: query
        required: false
        schema:
          type: boolean
          description: 快捷条件：有插座（任一类型）
          default: false
          title: Anyoutlet
        description: 快捷条件：有插座（任一类型）
      - name: onlyAvailable
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Onlyavailable
      - name: keyword
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          description: 自习室名称或座位编号
          title: Keyword
        description: 自习室名称或座位编号
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_RoomSeats_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m1/v1/seats/{seat_id}/timeline:
    get:
      tags:
      - M1 · 检索
      summary: 座位当日各整点时段状态（M1-SRH-02）
      description: 不显示他人身份，只给状态类别。
      operationId: seat_timeline_api_m1_v1_seats__seat_id__timeline_get
      security:
      - HTTPBearer: []
      parameters:
      - name: seat_id
        in: path
        required: true
        schema:
          type: integer
          title: Seat Id
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatTimeline'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m1/v1/bookings/history:
    get:
      tags:
      - M1 · 历史
      summary: 历史预约（M1-HIS-01）
      description: 按时间倒序分页；已注销座位仍显示当时的编号与自习室名称。
      operationId: booking_history_api_m1_v1_bookings_history_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: 页码，从 1 开始
          default: 1
          title: Page
        description: 页码，从 1 开始
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: 每页条数
          default: 20
          title: Size
        description: 每页条数
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/BookingStatus'
          - type: 'null'
          title: Status
      - name: dateFrom
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Datefrom
      - name: dateTo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Dateto
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_BookingOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m1/v1/bookings/{booking_id}/rebook:
    get:
      tags:
      - M1 · 历史
      summary: 再次预约该座位前的检查（M1-HIS-02）
      description: 前端据此预填座位；座位不可用时给出原因并引导回搜索。
      operationId: rebook_hint_api_m1_v1_bookings__booking_id__rebook_get
      security:
      - HTTPBearer: []
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: integer
          title: Booking Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebookHint'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m1/v1/bookings:
    post:
      tags:
      - M1 · 预约
      summary: 创建预约（M1-RSV-02）
      description: 按 BR-01 ~ BR-10 与暂停状态校验；规则不满足返回 RULE_VIOLATION 并给出规则编号；同一 Idempotency-Key 只产生一条预约；并发抢同一座位只有一人成功。
      operationId: create_booking_api_m1_v1_bookings_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m1/v1/bookings/current:
    get:
      tags:
      - M1 · 预约
      summary: 我的当前与即将开始的预约（M1-RSV-04）
      operationId: current_bookings_api_m1_v1_bookings_current_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BookingOut'
                type: array
                title: Response Current Bookings Api M1 V1 Bookings Current Get
      security:
      - HTTPBearer: []
  /api/m1/v1/bookings/{booking_id}:
    get:
      tags:
      - M1 · 预约
      summary: 预约详情（本人）
      operationId: get_booking_api_m1_v1_bookings__booking_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: integer
          title: Booking Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m1/v1/bookings/{booking_id}/cancel:
    post:
      tags:
      - M1 · 预约
      summary: 取消预约（M1-RSV-03）
      description: 签到截止前可取消「待签到」预约，不计违约，座位立即释放（BR-11）。
      operationId: cancel_booking_api_m1_v1_bookings__booking_id__cancel_post
      security:
      - HTTPBearer: []
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: integer
          title: Booking Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m1/v1/checkin/candidate:
    get:
      tags:
      - M1 · 签到
      summary: 扫码后找到本人在该室处于签到窗口内的预约（M1-CHK-04）
      description: 没有时返回 null，前端提示原因并给出「去预约」入口。
      operationId: checkin_candidate_api_m1_v1_checkin_candidate_get
      security:
      - HTTPBearer: []
      parameters:
      - name: roomId
        in: query
        required: true
        schema:
          type: integer
          title: Roomid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/BookingOut'
                - type: 'null'
                title: Response Checkin Candidate Api M1 V1 Checkin Candidate Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m1/v1/bookings/{booking_id}/checkin:
    post:
      tags:
      - M1 · 签到
      summary: 签到（M1-CHK-03、04）
      description: 校验：本人、待签到、在窗口内（BR-13）、码属于该室且有效（BR-16）、10 分钟内输错不超过 5 次（BR-17）。
      operationId: checkin_api_m1_v1_bookings__booking_id__checkin_post
      security:
      - HTTPBearer: []
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: integer
          title: Booking Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m1/v1/screen/code:
    get:
      tags:
      - M1 · 签到码与屏幕端
      summary: 屏幕端获取当前签到码（M1-CHK-02）
      description: 用请求头 X-Device-Token 鉴权；设备令牌只能取绑定自习室的码，吊销后被拒绝。
      operationId: screen_code_api_m1_v1_screen_code_get
      parameters:
      - name: X-Device-Token
        in: header
        required: true
        schema:
          type: string
          title: X-Device-Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenCode'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m1/v1/admin/screens:
    get:
      tags:
      - M1 · 签到码与屏幕端
      summary: 屏幕终端列表
      operationId: list_screens_api_m1_v1_admin_screens_get
      security:
      - HTTPBearer: []
      parameters:
      - name: roomId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Roomid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScreenDevice'
                title: Response List Screens Api M1 V1 Admin Screens Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - M1 · 签到码与屏幕端
      summary: 为自习室生成屏幕设备令牌
      operationId: create_screen_api_m1_v1_admin_screens_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreenDeviceCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenDeviceCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m1/v1/admin/screens/{device_id}/revoke:
    post:
      tags:
      - M1 · 签到码与屏幕端
      summary: 吊销屏幕设备令牌
      operationId: revoke_screen_api_m1_v1_admin_screens__device_id__revoke_post
      security:
      - HTTPBearer: []
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          type: integer
          title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenDevice'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m1/v1/violations/mine:
    get:
      tags:
      - M1 · 违约
      summary: 我的违约与处罚状态（M1-VIO-02）
      operationId: my_violations_api_m1_v1_violations_mine_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyViolations'
      security:
      - HTTPBearer: []
  /api/m1/v1/admin/violations:
    get:
      tags:
      - M1 · 违约
      summary: 范围内违约查询（M1-VIO-02）
      operationId: list_violations_api_m1_v1_admin_violations_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: 页码，从 1 开始
          default: 1
          title: Page
        description: 页码，从 1 开始
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: 每页条数
          default: 20
          title: Size
        description: 每页条数
      - name: userId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Userid
      - name: roomId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Roomid
      - name: dateFrom
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Datefrom
      - name: dateTo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Dateto
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ViolationOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m1/v1/admin/violations/{violation_id}/revoke:
    post:
      tags:
      - M1 · 违约
      summary: 撤销违约（M1-VIO-04）
      description: 原因必填、写入审计；撤销后重新计算处罚状态。
      operationId: revoke_violation_api_m1_v1_admin_violations__violation_id__revoke_post
      security:
      - HTTPBearer: []
      parameters:
      - name: violation_id
        in: path
        required: true
        schema:
          type: integer
          title: Violation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViolationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m1/v1/bookings/{booking_id}/checkout:
    post:
      tags:
      - M1 · 拓展（P2）
      summary: 提前签退（M1-RSV-06）
      description: 自下一个整点起释放剩余时段，状态为已完成（提前签退）。
      operationId: checkout_api_m1_v1_bookings__booking_id__checkout_post
      security:
      - HTTPBearer: []
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          type: integer
          title: Booking Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m1/v1/rooms/{room_id}/seat-map:
    get:
      tags:
      - M1 · 拓展（P2）
      summary: 座位图（M1-SRH-03）
      operationId: seat_map_api_m1_v1_rooms__room_id__seat_map_get
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: 默认今天（业务时区）
          title: Date
        description: 默认今天（业务时区）
      - name: startHour
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 23
            minimum: 0
          - type: 'null'
          description: 默认最近可约整点
          title: Starthour
        description: 默认最近可约整点
      - name: hours
        in: query
        required: false
        schema:
          type: integer
          maximum: 12
          minimum: 1
          default: 1
          title: Hours
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatMap'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m1/v1/seats/{seat_id}/alternatives:
    get:
      tags:
      - M1 · 拓展（P2）
      summary: 替代推荐：同室同标记的可约座位（M1-SRH-04）

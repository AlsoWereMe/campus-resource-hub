openapi: 3.1.0
info:
  title: notify API
  version: v1
paths:
  /api/notify/v1/inbox:
    get:
      tags:
      - 通知
      summary: 我的站内消息（NTF-03）
      operationId: inbox_api_notify_v1_inbox_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: 页码，从 1 开始
          default: 1
          title: Page
        description: 页码，从 1 开始
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: 每页条数
          default: 20
          title: Size
        description: 每页条数
      - name: unreadOnly
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Unreadonly
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_InboxMessage_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/notify/v1/inbox/unread-count:
    get:
      tags:
      - 通知
      summary: 未读数（NTF-03）
      operationId: unread_count_api_notify_v1_inbox_unread_count_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
      security:
      - HTTPBearer: []
  /api/notify/v1/inbox/{message_id}/read:
    post:
      tags:
      - 通知
      summary: 标记已读（NTF-03）
      operationId: mark_read_api_notify_v1_inbox__message_id__read_post
      security:
      - HTTPBearer: []
      parameters:
      - name: message_id
        in: path
        required: true
        schema:
          type: integer
          title: Message Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/notify/v1/inbox/read-all:
    post:
      tags:
      - 通知
      summary: 全部标记已读（NTF-03）
      operationId: mark_all_read_api_notify_v1_inbox_read_all_post
      responses:
        '204':
          description: Successful Response
      security:
      - HTTPBearer: []
  /api/notify/v1/templates:
    get:
      tags:
      - 通知
      summary: 通知模板列表（NTF-02）
      operationId: templates_api_notify_v1_templates_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Template'
                type: array
                title: Response Templates Api Notify V1 Templates Get
      security:
      - HTTPBearer: []
  /api/notify/v1/templates/{event}:
    put:
      tags:
      - 通知
      summary: 修改某类事件的模板（NTF-02）
      operationId: update_template_api_notify_v1_templates__event__put
      security:
      - HTTPBearer: []
      parameters:
      - name: event
        in: path
        required: true
        schema:
          type: string
          title: Event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/notify/v1/deliveries:
    get:
      tags:
      - 通知
      summary: 投递记录（NTF-04）
      operationId: deliveries_api_notify_v1_deliveries_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: 页码，从 1 开始
          default: 1
          title: Page
        description: 页码，从 1 开始
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: 每页条数
          default: 20
          title: Size
        description: 每页条数
      - name: recipientUserId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Recipientuserid
      - name: event
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Event
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - PENDING
            - SENT
            - FAILED
            type: string
          - type: 'null'
          title: Status
      - name: dateFrom
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Datefrom
      - name: dateTo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Dateto
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_Delivery_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
tags:
- name: 通知
  description: 任务 D-T05
components:
  schemas:
    Delivery:
      properties:
        id:
          type: integer
          title: Id
        idempotencyKey:
          type: string
          title: Idempotencykey
        recipientUserId:
          type: integer
          title: Recipientuserid
        event:
          type: string
          title: Event
        channel:
          type: string
          enum:
          - email
          - inbox
          title: Channel
        status:
          type: string
          enum:
          - PENDING
          - SENT
          - FAILED
          title: Status
        attempts:
          type: integer
          title: Attempts
        lastError:
          anyOf:
          - type: string
          - type: 'null'
          title: Lasterror
        createdAt:
          type: string
          format: date-time
          title: Createdat
        sentAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Sentat
      type: object
      required:
      - id
      - idempotencyKey
      - recipientUserId
      - event
      - channel
      - status
      - attempts
      - lastError
      - createdAt
      - sentAt
      title: Delivery
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InboxMessage:
      properties:
        id:
          type: integer
          title: Id
        event:
          type: string
          title: Event
        title:
          type: string
          title: Title
        body:
          type: string
          title: Body
        read:
          type: boolean
          title: Read
        createdAt:
          type: string
          format: date-time
          title: Createdat
      type: object
      required:
      - id
      - event
      - title
      - body
      - read
      - createdAt
      title: InboxMessage
    Page_Delivery_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Delivery'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        size:
          type: integer
          title: Size
      type: object
      required:
      - items
      - total
      - page
      - size
      title: Page[Delivery]
    Page_InboxMessage_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/InboxMessage'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        size:
          type: integer
          title: Size
      type: object
      required:
      - items
      - total
      - page
      - size
      title: Page[InboxMessage]
    Template:
      properties:
        event:
          type: string
          title: Event
          description: 事件类型，如 m1.booking.reminder
        title:
          type: string
          title: Title
        body:
          type: string
          title: Body
          description: 支持 ${变量} 占位，如 ${roomName}
      type: object
      required:
      - event
      - title
      - body
      title: Template
    TemplateIn:
      properties:
        title:
          type: string
          maxLength: 100
          title: Title
        body:
          type: string
          maxLength: 2000
          title: Body
      type: object
      required:
      - title
      - body
      title: TemplateIn
    UnreadCount:
      properties:
        count:
          type: integer
          title: Count
      type: object
      required:
      - count
      title: UnreadCount
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      description: IAM 签发的访问令牌
      scheme: bearer

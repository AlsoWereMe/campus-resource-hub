openapi: 3.1.0
info:
  title: iam API
  version: v1
paths:
  /api/iam/v1/auth/login:
    post:
      tags:
      - IAM · 登录
      summary: 账号登录（IAM-AUTH-01）
      description: 连续失败达到上限后锁定一段时间；用户不存在与口令错误返回同一种错误。
      operationId: login_api_iam_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/iam/v1/auth/refresh:
    post:
      tags:
      - IAM · 登录
      summary: 用刷新令牌换取新令牌（IAM-AUTH-01）
      description: 刷新令牌一次性使用：换取新令牌后旧刷新令牌立即失效。
      operationId: refresh_api_iam_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/iam/v1/auth/logout:
    post:
      tags:
      - IAM · 登录
      summary: 登出（IAM-AUTH-01）
      operationId: logout_api_iam_v1_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshIn'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/iam/v1/auth/password:
    post:
      tags:
      - IAM · 登录
      summary: 修改口令（IAM-AUTH-01）
      description: 修改成功后，该用户所有刷新令牌失效。
      operationId: change_password_api_iam_v1_auth_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeIn'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/iam/v1/me:
    get:
      tags:
      - IAM · 登录
      summary: 当前用户、角色与权限点
      operationId: me_api_iam_v1_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
      security:
      - HTTPBearer: []
  /internal/iam/v1/jwks:
    get:
      tags:
      - IAM · 内部
      summary: 令牌验签公钥（JWKS）
      operationId: jwks_internal_iam_v1_jwks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
  /internal/iam/v1/service-token:
    post:
      tags:
      - IAM · 内部
      summary: 用服务凭证换取服务令牌
      operationId: service_token_internal_iam_v1_service_token_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceTokenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
tags:
- name: IAM · 登录
  description: 登录、令牌、当前用户（已实现）
- name: IAM · 内部
  description: JWKS、服务凭证（已实现）；网关不对外暴露
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Jwks:
      properties:
        keys:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Keys
      type: object
      required:
      - keys
      title: Jwks
    LoginIn:
      properties:
        username:
          type: string
          maxLength: 64
          minLength: 1
          title: Username
        password:
          type: string
          maxLength: 128
          minLength: 1
          title: Password
      type: object
      required:
      - username
      - password
      title: LoginIn
    MeOut:
      properties:
        id:
          type: integer
          title: Id
        username:
          type: string
          title: Username
        name:
          type: string
          title: Name
        userType:
          type: string
          title: Usertype
        departmentId:
          anyOf:
          - type: integer
          - type: 'null'
          title: Departmentid
        departmentName:
          anyOf:
          - type: string
          - type: 'null'
          title: Departmentname
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        roles:
          items:
            type: string
          type: array
          title: Roles
        permissions:
          items:
            type: string
          type: array
          title: Permissions
      type: object
      required:
      - id
      - username
      - name
      - userType
      - departmentId
      - departmentName
      - email
      - roles
      - permissions
      title: MeOut
    PasswordChangeIn:
      properties:
        oldPassword:
          type: string
          title: Oldpassword
        newPassword:
          type: string
          maxLength: 128
          minLength: 8
          title: Newpassword
      type: object
      required:
      - oldPassword
      - newPassword
      title: PasswordChangeIn
    RefreshIn:
      properties:
        refreshToken:
          type: string
          title: Refreshtoken
      type: object
      required:
      - refreshToken
      title: RefreshIn
    ServiceTokenRequest:
      properties:
        clientId:
          type: string
          title: Clientid
        clientSecret:
          type: string
          title: Clientsecret
      type: object
      required:
      - clientId
      - clientSecret
      title: ServiceTokenRequest
    TokenResponse:
      properties:
        accessToken:
          type: string
          title: Accesstoken
        tokenType:
          type: string
          const: Bearer
          title: Tokentype
          default: Bearer
        expiresIn:
          type: integer
          title: Expiresin
        refreshToken:
          anyOf:
          - type: string
          - type: 'null'
          title: Refreshtoken
      type: object
      required:
      - accessToken
      - expiresIn
      title: TokenResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      description: IAM 签发的访问令牌
      scheme: bearer

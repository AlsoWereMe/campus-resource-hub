              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m2/v1/admin/stats:
    get:
      tags:
      - M2 · 管理
      summary: 申请统计（M2-QRY-03，P2）
      operationId: stats_api_m2_v1_admin_stats_get
      security:
      - HTTPBearer: []
      parameters:
      - name: dateFrom
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Datefrom
      - name: dateTo
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Dateto
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomStats'
                title: Response Stats Api M2 V1 Admin Stats Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ApplicableRoom:
      properties:
        roomId:
          type: integer
          title: Roomid
        code:
          type: string
          title: Code
        name:
          type: string
          title: Name
        buildingName:
          type: string
          title: Buildingname
        roomType:
          $ref: '#/components/schemas/RoomType'
        capacity:
          type: integer
          title: Capacity
        facilities:
          items:
            type: string
          type: array
          title: Facilities
        openingHours:
          type: string
          title: Openinghours
        applicable:
          type: boolean
          title: Applicable
          description: 所选时段是否可申请
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: 不可申请的原因：已有申请 / 维修下架 / 不在开放时间
      type: object
      required:
      - roomId
      - code
      - name
      - buildingName
      - roomType
      - capacity
      - facilities
      - openingHours
      - applicable
      title: ApplicableRoom
    ApplicantType:
      type: string
      enum:
      - STAFF
      - STUDENT_LEADER
      title: ApplicantType
    ApplicationCreate:
      properties:
        roomId:
          type: integer
          title: Roomid
        date:
          type: string
          format: date
          title: Date
        startHour:
          type: integer
          maximum: 23.0
          minimum: 0.0
          title: Starthour
          description: 整点（BR-M2-01）
        hours:
          type: integer
          maximum: 24.0
          minimum: 1.0
          title: Hours
          description: 实际上限取参数 m2.max_duration_hours
        title:
          type: string
          maxLength: 50
          minLength: 1
          title: Title
          description: 活动名称
        purpose:
          type: string
          maxLength: 500
          minLength: 1
          title: Purpose
        attendees:
          type: integer
          minimum: 1.0
          title: Attendees
          description: 预计人数，不得超过房间容量（BR-M2-06）
        contactName:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: Contactname
          description: 默认本人
        contactPhone:
          anyOf:
          - type: string
            maxLength: 32
          - type: 'null'
          title: Contactphone
        remark:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Remark
      type: object
      required:
      - roomId
      - date
      - startHour
      - hours
      - title
      - purpose
      - attendees
      title: ApplicationCreate
    ApplicationOut:
      properties:
        id:
          type: integer
          title: Id
        roomId:
          type: integer
          title: Roomid
        roomCode:
          type: string
          title: Roomcode
        roomName:
          type: string
          title: Roomname
        buildingName:
          type: string
          title: Buildingname
        startsAt:
          type: string
          format: date-time
          title: Startsat
        endsAt:
          type: string
          format: date-time
          title: Endsat
        title:
          type: string
          title: Title
        purpose:
          type: string
          title: Purpose
        attendees:
          type: integer
          title: Attendees
        contactName:
          type: string
          title: Contactname
        contactPhone:
          anyOf:
          - type: string
          - type: 'null'
          title: Contactphone
        remark:
          anyOf:
          - type: string
          - type: 'null'
          title: Remark
        applicantId:
          type: integer
          title: Applicantid
        applicantName:
          type: string
          title: Applicantname
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        currentLevel:
          anyOf:
          - type: integer
          - type: 'null'
          title: Currentlevel
          description: 审批中时的当前级别
        deadline:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Deadline
          description: 当前级别的审批截止时刻（BR-M2-11）
        chain:
          items:
            $ref: '#/components/schemas/ApprovalLevel'
          type: array
          title: Chain
          description: 提交时固化的审批链快照（M2-APP-02）
        records:
          items:
            $ref: '#/components/schemas/ApprovalRecord'
          type: array
          title: Records
        writeback:
          type: string
          enum:
          - NONE
          - SYNCING
          - SYNCED
          - FAILED
          title: Writeback
          description: 在 M1 中的占用同步状态（M2-INT-03）
        createdAt:
          type: string
          format: date-time
          title: Createdat
      type: object
      required:
      - id
      - roomId
      - roomCode
      - roomName
      - buildingName
      - startsAt
      - endsAt
      - title
      - purpose
      - attendees
      - contactName
      - contactPhone
      - remark
      - applicantId
      - applicantName
      - status
      - currentLevel
      - deadline
      - chain
      - records
      - writeback
      - createdAt
      title: ApplicationOut
    ApplicationStatus:
      type: string

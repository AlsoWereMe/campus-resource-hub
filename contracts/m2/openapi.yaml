        scope:
          $ref: '#/components/schemas/BlockScope'
        startsAt:
          type: string
          format: date-time
          title: Startsat
        endsAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Endsat
      type: object
      required:
      - source
      - sourceRef
      - kind
      - scope
      - startsAt
      - endsAt
      title: BlockBrief
    BlockKind:
      type: string
      enum:
      - HOLD
      - ACTIVE
      title: BlockKind
    BlockScope:
      type: string
      enum:

openapi: 3.1.0
info:
  title: m2 API
  version: v1
paths:
  /api/m2/v1/rooms:
    get:
      tags:
      - M2 · 房间
      summary: 可申请房间检索（M2-ROOM-01）
      description: 只返回申请人有资格申请的可整间预约房间（BR-M2-17），并说明不可申请的原因。
      operationId: search_rooms_api_m2_v1_rooms_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: 页码，从 1 开始
          default: 1
          title: Page
        description: 页码，从 1 开始
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: 每页条数
          default: 20
          title: Size
        description: 每页条数
      - name: date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date
      - name: startHour
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 23
            minimum: 0
          - type: 'null'
          title: Starthour
      - name: hours
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 24
            minimum: 1
          - type: 'null'
          title: Hours
      - name: buildingId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Buildingid
      - name: roomType
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/RoomType'
          - type: 'null'
          title: Roomtype
      - name: minCapacity
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          description: 预计人数
          title: Mincapacity
        description: 预计人数
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ApplicableRoom_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m2/v1/rooms/{room_id}/calendar:
    get:
      tags:
      - M2 · 房间
      summary: 房间占用日历（M2-ROOM-02，P1）
      operationId: room_calendar_api_m2_v1_rooms__room_id__calendar_get
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      - name: dateFrom
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Datefrom
      - name: dateTo
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Dateto
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarItem'
                title: Response Room Calendar Api M2 V1 Rooms  Room Id  Calendar Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m2/v1/rooms/{room_id}/conflicts:
    get:
      tags:
      - M2 · 房间
      summary: 冲突预检（M2-INT-02）
      description: 调用 M1 可用性查询。提交前查询失败则不可提交；审批页查询失败只提示。
      operationId: room_conflicts_api_m2_v1_rooms__room_id__conflicts_get
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Date
      - name: startHour
        in: query
        required: true
        schema:
          type: integer
          maximum: 23
          minimum: 0
          title: Starthour
      - name: hours
        in: query
        required: true
        schema:
          type: integer
          maximum: 24
          minimum: 1
          title: Hours
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictPreview'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m2/v1/applications/check:
    post:
      tags:
      - M2 · 准入校验
      summary: 提交前预检准入门槛（M2-ELG-01 ~ 05）
      operationId: check_eligibility_api_m2_v1_applications_check_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/m2/v1/applications:
    post:
      tags:
      - M2 · 申请
      summary: 提交整间申请（M2-APP-01）
      description: 准入校验（M2-T02）→ 冲突校验（BR-M2-04、05）→ 匹配并固化审批链 → 写回 HOLD → 通知第 1 级审批人。同一 Idempotency-Key
        只产生一条申请。
      operationId: submit_application_api_m2_v1_applications_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m2/v1/applications/mine:
    get:
      tags:
      - M2 · 申请
      summary: 我的申请（M2-QRY-01）
      operationId: my_applications_api_m2_v1_applications_mine_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: 页码，从 1 开始
          default: 1
          title: Page
        description: 页码，从 1 开始
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: 每页条数
          default: 20
          title: Size
        description: 每页条数
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/ApplicationStatus'
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ApplicationOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m2/v1/applications/{application_id}:
    get:
      tags:
      - M2 · 申请
      summary: 申请详情：审批时间线、截止时刻、写回状态（M2-APV-04）
      operationId: get_application_api_m2_v1_applications__application_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: integer
          title: Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m2/v1/applications/{application_id}/withdraw:
    post:
      tags:
      - M2 · 申请
      summary: 撤回审批中的申请（M2-APP-03）
      operationId: withdraw_application_api_m2_v1_applications__application_id__withdraw_post
      security:
      - HTTPBearer: []
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: integer
          title: Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m2/v1/applications/{application_id}/cancel:
    post:
      tags:
      - M2 · 申请
      summary: 取消已通过、未开始的申请（M2-APP-04）
      description: 释放占用；被 M1 取消的个人预约不恢复。开始后不能取消（BR-M2-13）。
      operationId: cancel_application_api_m2_v1_applications__application_id__cancel_post
      security:
      - HTTPBearer: []
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: integer
          title: Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m2/v1/admin/applications/{application_id}/writeback/retry:
    post:
      tags:
      - M2 · 申请
      summary: 手动重试失败的写回（M2-INT-03）
      operationId: retry_writeback_api_m2_v1_admin_applications__application_id__writeback_retry_post
      security:
      - HTTPBearer: []
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: integer
          title: Application Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m2/v1/approvals/pending:
    get:
      tags:
      - M2 · 审批
      summary: 待我审批（M2-APV-01）
      description: 按截止时刻升序；不含本人提交的申请与本人已审批过的申请（M2-APV-05）。
      operationId: pending_approvals_api_m2_v1_approvals_pending_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: 页码，从 1 开始
          default: 1
          title: Page
        description: 页码，从 1 开始
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: 每页条数
          default: 20
          title: Size
        description: 每页条数
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ApplicationOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m2/v1/approvals/done:
    get:
      tags:
      - M2 · 审批
      summary: 我已审批
      operationId: done_approvals_api_m2_v1_approvals_done_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: 页码，从 1 开始
          default: 1
          title: Page
        description: 页码，从 1 开始
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: 每页条数
          default: 20
          title: Size
        description: 每页条数
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ApplicationOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m2/v1/applications/{application_id}/approve:
    post:
      tags:
      - M2 · 审批
      summary: 通过当前级别（M2-APV-02）
      description: 有下一级则进入下一级并通知；末级通过则写回 ACTIVE 并通知申请人。
      operationId: approve_api_m2_v1_applications__application_id__approve_post
      security:
      - HTTPBearer: []
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: integer
          title: Application Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m2/v1/applications/{application_id}/reject:
    post:
      tags:
      - M2 · 审批
      summary: 驳回（M2-APV-03）
      operationId: reject_api_m2_v1_applications__application_id__reject_post
      security:
      - HTTPBearer: []
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: integer
          title: Application Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m2/v1/applications/{application_id}/transfer:
    post:
      tags:
      - M2 · 审批
      summary: 转交同级审批人（M2-APV-06，P2）
      operationId: transfer_api_m2_v1_applications__application_id__transfer_post
      security:
      - HTTPBearer: []
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: integer
          title: Application Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m2/v1/admin/flows:
    get:
      tags:
      - M2 · 审批链与参数
      summary: 审批链规则列表（M2-FLOW-01）
      operationId: list_flows_api_m2_v1_admin_flows_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FlowRule'
                type: array
                title: Response List Flows Api M2 V1 Admin Flows Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - M2 · 审批链与参数
      summary: 新增审批链规则（M2-FLOW-02）
      description: 只影响此后提交的申请（M2-APP-02）；写入审计。
      operationId: create_flow_api_m2_v1_admin_flows_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowRuleIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowRule'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/m2/v1/admin/flows/{flow_id}:
    put:
      tags:
      - M2 · 审批链与参数
      summary: 修改审批链规则（M2-FLOW-02）
      operationId: update_flow_api_m2_v1_admin_flows__flow_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: flow_id
        in: path
        required: true
        schema:
          type: integer
          title: Flow Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowRuleIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowRule'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - M2 · 审批链与参数
      summary: 删除审批链规则（M2-FLOW-02）
      operationId: delete_flow_api_m2_v1_admin_flows__flow_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: flow_id
        in: path
        required: true
        schema:
          type: integer
          title: Flow Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m2/v1/admin/settings:

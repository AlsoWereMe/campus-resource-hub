      - M3_REPAIR
      - ADMIN
      title: BlockSource
    CalendarItem:
      properties:
        startsAt:
          type: string
          format: date-time
          title: Startsat
        endsAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Endsat
        kind:
          type: string
          enum:
          - APPLICATION
          - REPAIR
          - PERSONAL_BOOKINGS
          title: Kind
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
          description: 整间申请的状态；不显示申请人
        count:
          anyOf:

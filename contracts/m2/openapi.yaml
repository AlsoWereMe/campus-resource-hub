        description: 页码，从 1 开始
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: 每页条数
          default: 20
          title: Size
        description: 每页条数
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/ApplicationStatus'
          - type: 'null'
          title: Status
      - name: roomId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Roomid
      - name: applicantId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Applicantid
      - name: dateFrom
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Datefrom
      - name: dateTo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Dateto
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ApplicationOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/m2/v1/admin/applications/{application_id}/revoke:
    post:
      tags:
      - M2 · 管理
      summary: 撤销已通过的申请（M2-APP-06）
      description: 理由必填、写入审计；释放占用并通知申请人。
      operationId: revoke_application_api_m2_v1_admin_applications__application_id__revoke_post
      security:
      - HTTPBearer: []
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: integer
          title: Application Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeIn'
      responses:

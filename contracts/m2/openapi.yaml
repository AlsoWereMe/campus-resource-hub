      - PENDING
      - APPROVED
      - REJECTED
      - WITHDRAWN
      - EXPIRED
      - CANCELLED
      - REVOKED
      - COMPLETED
      title: ApplicationStatus
    ApprovalLevel:
      properties:
        level:
          type: integer
          minimum: 1.0
          title: Level
        role:
          type: string
          title: Role
          description: 审批角色，如 dept_approver、room_admin、resource_admin
        scopeFrom:
          $ref: '#/components/schemas/ScopeFrom'
      type: object
      required:
      - level
      - role
      - scopeFrom
      title: ApprovalLevel
    ApprovalRecord:
      properties:

      - HTTPBearer: []
    put:
      tags:
      - M2 · 审批链与参数
      summary: 修改 M2 参数（BR-M2-19：只作用于新申请）
      operationId: update_settings_api_m2_v1_admin_settings_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Setting'
                type: array
                title: Response Update Settings Api M2 V1 Admin Settings Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/m2/v1/admin/applications:
    get:
      tags:
      - M2 · 管理
      summary: 范围内全部申请（M2-QRY-02）
      operationId: list_applications_api_m2_v1_admin_applications_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:

          - type: string
          - type: 'null'
          title: Comment
        at:
          type: string
          format: date-time
          title: At
      type: object
      required:
      - level
      - approverId
      - approverName
      - action
      - comment
      - at
      title: ApprovalRecord
    ApproveIn:
      properties:

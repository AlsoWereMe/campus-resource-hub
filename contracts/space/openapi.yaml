openapi: 3.1.0
info:
  title: space API
  version: v1
paths:
  /api/space/v1/campuses:
    get:
      tags:
      - 空间 · 查询
      summary: 校区列表
      operationId: campuses_api_space_v1_campuses_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Campus'
                type: array
                title: Response Campuses Api Space V1 Campuses Get
      security:
      - HTTPBearer: []
  /api/space/v1/buildings:
    get:
      tags:
      - 空间 · 查询
      summary: 楼宇列表
      operationId: buildings_api_space_v1_buildings_get
      security:
      - HTTPBearer: []
      parameters:
      - name: campusId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Campusid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Building'
                title: Response Buildings Api Space V1 Buildings Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/space/v1/rooms:
    get:
      tags:
      - 空间 · 查询
      summary: 房间列表（含公共区域，可按条件筛选）
      operationId: rooms_api_space_v1_rooms_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: 页码，从 1 开始
          default: 1
          title: Page
        description: 页码，从 1 开始
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: 每页条数
          default: 20
          title: Size
        description: 每页条数
      - name: campusId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Campusid
      - name: buildingId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Buildingid
      - name: roomType
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/RoomType'
          - type: 'null'
          title: Roomtype
      - name: studyOpen
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: 只看已开放为自习室的房间
          title: Studyopen
        description: 只看已开放为自习室的房间
      - name: wholeRoomBookable
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: 只看允许整间预约的房间
          title: Wholeroombookable
        description: 只看允许整间预约的房间
      - name: departmentId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Departmentid
      - name: keyword
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          description: 匹配房间编号或名称
          title: Keyword
        description: 匹配房间编号或名称
      - name: ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: integer
          - type: 'null'
          description: 按 ID 批量查询
          title: Ids
        description: 按 ID 批量查询
      - name: includeDeleted
        in: query
        required: false
        schema:
          type: boolean
          description: 包含已注销的房间（用于历史展示）
          default: false
          title: Includedeleted
        description: 包含已注销的房间（用于历史展示）
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_RoomInfo_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/space/v1/rooms/{room_id}:
    get:
      tags:
      - 空间 · 查询
      summary: 房间详情（含开放时间、整间预约属性）
      operationId: room_api_space_v1_rooms__room_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomInfo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/space/v1/rooms/{room_id}/seats:
    get:
      tags:
      - 空间 · 查询
      summary: 房间内的座位
      operationId: room_seats_api_space_v1_rooms__room_id__seats_get
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: 须带全部所列标记
          title: Tag
        description: 须带全部所列标记
      - name: includeDisabled
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Includedisabled
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeatInfo'
                title: Response Room Seats Api Space V1 Rooms  Room Id  Seats Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/space/v1/seats/{seat_id}:
    get:
      tags:
      - 空间 · 查询
      summary: 座位详情
      operationId: seat_api_space_v1_seats__seat_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: seat_id
        in: path
        required: true
        schema:
          type: integer
          title: Seat Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatInfo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/space/v1/tags:
    get:
      tags:
      - 空间 · 查询
      summary: 座位标记字典
      operationId: tags_api_space_v1_tags_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TagOut'
                type: array
                title: Response Tags Api Space V1 Tags Get
      security:
      - HTTPBearer: []
tags:
- name: 空间 · 查询
  description: 校区、楼宇、房间、座位（已实现）
components:
  schemas:
    ApplicantType:
      type: string
      enum:
      - STAFF
      - STUDENT_LEADER
      title: ApplicantType
    Building:
      properties:
        id:
          type: integer
          title: Id
        campusId:
          type: integer
          title: Campusid
        code:
          type: string
          title: Code
        name:
          type: string
          title: Name
      type: object
      required:
      - id
      - campusId
      - code
      - name
      title: Building
    Campus:
      properties:
        id:
          type: integer
          title: Id
        code:
          type: string
          title: Code
        name:
          type: string
          title: Name
      type: object
      required:
      - id
      - code
      - name
      title: Campus
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    OpeningRule:
      properties:
        weekday:
          type: integer
          maximum: 7.0
          minimum: 1.0
          title: Weekday
          description: 1=周一 … 7=周日
        startHour:
          type: integer
          maximum: 23.0
          minimum: 0.0
          title: Starthour
        endHour:
          type: integer
          maximum: 24.0
          minimum: 1.0
          title: Endhour
          description: 不含；起止均为整点（BR-22）
      type: object
      required:
      - weekday
      - startHour
      - endHour
      title: OpeningRule
    OwnerType:
      type: string
      enum:
      - SCHOOL
      - DEPARTMENT
      title: OwnerType
    Page_RoomInfo_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/RoomInfo'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        size:
          type: integer
          title: Size
      type: object
      required:
      - items
      - total
      - page
      - size
      title: Page[RoomInfo]
    RoomInfo:
      properties:
        id:
          type: integer
          title: Id
        code:
          type: string
          title: Code
        name:
          type: string
          title: Name
        campusId:
          type: integer
          title: Campusid
        buildingId:
          type: integer
          title: Buildingid
        buildingName:
          type: string
          title: Buildingname
        floor:
          anyOf:
          - type: integer
          - type: 'null'
          title: Floor
        roomType:
          $ref: '#/components/schemas/RoomType'
        capacity:
          type: integer
          title: Capacity
        ownerType:
          $ref: '#/components/schemas/OwnerType'
        departmentId:
          anyOf:
          - type: integer
          - type: 'null'
          title: Departmentid
          description: 归属院系；校级房间为空
        status:
          $ref: '#/components/schemas/Status'
        studyOpen:
          type: boolean
          title: Studyopen
          description: 是否开放为自习室（SPC-ROOM-02）
        wholeRoomBookable:
          type: boolean
          title: Wholeroombookable
          description: 是否允许整间预约（SPC-ROOM-05）
        allowedApplicantTypes:
          items:
            $ref: '#/components/schemas/ApplicantType'
          type: array
          title: Allowedapplicanttypes
        facilities:
          items:
            type: string
          type: array
          title: Facilities
        openingRules:
          items:
            $ref: '#/components/schemas/OpeningRule'
          type: array
          title: Openingrules
        closures:
          items:
            type: string
            format: date
          type: array
          title: Closures
          description: 闭馆日期（P1）
      type: object
      required:
      - id
      - code
      - name
      - campusId
      - buildingId
      - buildingName
      - roomType
      - capacity
      - ownerType
      - status
      - studyOpen
      - wholeRoomBookable
      title: RoomInfo
    RoomType:
      type: string
      enum:
      - CLASSROOM
      - LIBRARY_STUDY
      - OTHER_STUDY
      - MEETING
      - PUBLIC_AREA
      title: RoomType
    SeatInfo:
      properties:
        id:
          type: integer
          title: Id
        roomId:
          type: integer
          title: Roomid
        code:
          type: string
          title: Code
        status:
          $ref: '#/components/schemas/Status'
        tags:
          items:
            type: string
          type: array
          title: Tags
        row:
          anyOf:
          - type: integer
          - type: 'null'
          title: Row
        col:
          anyOf:
          - type: integer
          - type: 'null'
          title: Col
      type: object
      required:
      - id
      - roomId
      - code
      - status
      title: SeatInfo
    Status:
      type: string
      enum:
      - ENABLED
      - DISABLED
      - DELETED
      title: Status
    TagOut:
      properties:
        code:
          type: string
          title: Code
        name:
          type: string
          title: Name
      type: object
      required:
      - code
      - name
      title: TagOut
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      description: IAM 签发的访问令牌
      scheme: bearer

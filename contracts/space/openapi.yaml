openapi: 3.1.0
info:
  title: space API
  version: v1
paths:
  /api/space/v1/campuses:
    get:
      tags:
      - 空间 · 查询
      summary: 校区列表
      operationId: campuses_api_space_v1_campuses_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Campus'
                type: array
                title: Response Campuses Api Space V1 Campuses Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - 空间 · 房间管理
      summary: 新增校区
      operationId: create_campus_api_space_v1_campuses_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampusIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/space/v1/buildings:
    get:
      tags:
      - 空间 · 查询
      summary: 楼宇列表
      operationId: buildings_api_space_v1_buildings_get
      security:
      - HTTPBearer: []
      parameters:
      - name: campusId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Campusid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Building'
                title: Response Buildings Api Space V1 Buildings Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - 空间 · 房间管理
      summary: 新增楼宇
      operationId: create_building_api_space_v1_buildings_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/space/v1/rooms:
    get:
      tags:
      - 空间 · 查询
      summary: 房间列表（含公共区域，可按条件筛选）
      operationId: rooms_api_space_v1_rooms_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: 页码，从 1 开始
          default: 1
          title: Page
        description: 页码，从 1 开始
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: 每页条数
          default: 20
          title: Size
        description: 每页条数
      - name: campusId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Campusid
      - name: buildingId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Buildingid
      - name: roomType
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/RoomType'
          - type: 'null'
          title: Roomtype
      - name: studyOpen
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: 只看已开放为自习室的房间
          title: Studyopen
        description: 只看已开放为自习室的房间
      - name: wholeRoomBookable
        in: query
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          description: 只看允许整间预约的房间
          title: Wholeroombookable
        description: 只看允许整间预约的房间
      - name: departmentId
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Departmentid
      - name: keyword
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          description: 匹配房间编号或名称
          title: Keyword
        description: 匹配房间编号或名称
      - name: ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: integer
          - type: 'null'
          description: 按 ID 批量查询
          title: Ids
        description: 按 ID 批量查询
      - name: includeDeleted
        in: query
        required: false
        schema:
          type: boolean
          description: 包含已注销的房间（用于历史展示）
          default: false
          title: Includedeleted
        description: 包含已注销的房间（用于历史展示）
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_RoomInfo_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - 空间 · 房间管理
      summary: 新增房间（SPC-ROOM-01）
      operationId: create_room_api_space_v1_rooms_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomInfo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/space/v1/rooms/{room_id}:
    get:
      tags:
      - 空间 · 查询
      summary: 房间详情（含开放时间、整间预约属性）
      operationId: room_api_space_v1_rooms__room_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomInfo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - 空间 · 房间管理
      summary: 修改房间属性（SPC-ROOM-01、04）
      operationId: update_room_api_space_v1_rooms__room_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomInfo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/space/v1/rooms/{room_id}/seats:
    get:
      tags:
      - 空间 · 查询
      summary: 房间内的座位
      operationId: room_seats_api_space_v1_rooms__room_id__seats_get
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: 须带全部所列标记
          title: Tag
        description: 须带全部所列标记
      - name: includeDisabled
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Includedisabled
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeatInfo'
                title: Response Room Seats Api Space V1 Rooms  Room Id  Seats Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/space/v1/seats/{seat_id}:
    get:
      tags:
      - 空间 · 查询
      summary: 座位详情
      operationId: seat_api_space_v1_seats__seat_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: seat_id
        in: path
        required: true
        schema:
          type: integer
          title: Seat Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatInfo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - 空间 · 座位与标记
      summary: 修改座位平面位置（SPC-SEAT-03，P2）
      operationId: update_seat_api_space_v1_seats__seat_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: seat_id
        in: path
        required: true
        schema:
          type: integer
          title: Seat Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatInfo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/space/v1/tags:
    get:
      tags:
      - 空间 · 查询
      summary: 座位标记字典
      operationId: tags_api_space_v1_tags_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TagOut'
                type: array
                title: Response Tags Api Space V1 Tags Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - 空间 · 座位与标记
      summary: 扩展标记字典（SPC-TAG-01，P2）
      operationId: create_tag_api_space_v1_tags_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/space/v1/rooms/{room_id}/study:
    post:
      tags:
      - 空间 · 房间管理
      summary: 开放为自习室或关闭自习（SPC-ROOM-02）
      description: 关闭时若有未结束预约，先返回影响预览；确认后执行，受影响学生收到通知且不计违约。
      operationId: set_study_open_api_space_v1_rooms__room_id__study_post
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyOpenIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpactPreview'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/space/v1/rooms/{room_id}/status:
    post:
      tags:
      - 空间 · 房间管理
      summary: 启用、停用、注销房间（SPC-ROOM-01、02）
      operationId: set_room_status_api_space_v1_rooms__room_id__status_post
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpactPreview'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/space/v1/rooms/{room_id}/booking-policy:
    put:
      tags:
      - 空间 · 房间管理
      summary: 整间预约属性（SPC-ROOM-05）
      operationId: set_booking_policy_api_space_v1_rooms__room_id__booking_policy_put
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingPolicyIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomInfo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/space/v1/rooms/{room_id}/facilities:
    put:
      tags:
      - 空间 · 房间管理
      summary: 房间设施（SPC-ROOM-06，P2）
      operationId: set_facilities_api_space_v1_rooms__room_id__facilities_put
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FacilitiesIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomInfo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/space/v1/rooms/{room_id}/opening-hours:
    put:
      tags:
      - 空间 · 开放时间
      summary: 设置按星期的开放时间（SPC-ROOM-03）
      description: 非整点被拒绝（BR-22）；缩短开放时间时按 SPC-ROOM-02 的确认流程处理受影响预约。
      operationId: set_opening_hours_api_space_v1_rooms__room_id__opening_hours_put
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpeningHoursIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpactPreview'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/space/v1/rooms/{room_id}/closures:
    get:
      tags:
      - 空间 · 开放时间
      summary: 闭馆日列表（P1）
      operationId: list_closures_api_space_v1_rooms__room_id__closures_get
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClosureOut'
                title: Response List Closures Api Space V1 Rooms  Room Id  Closures Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - 空间 · 开放时间
      summary: 新增闭馆日（P1）
      operationId: add_closure_api_space_v1_rooms__room_id__closures_post
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClosureIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosureOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/space/v1/rooms/{room_id}/closures/{closure_id}:
    delete:
      tags:
      - 空间 · 开放时间
      summary: 删除闭馆日（P1）
      operationId: delete_closure_api_space_v1_rooms__room_id__closures__closure_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      - name: closure_id
        in: path
        required: true
        schema:
          type: integer
          title: Closure Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/space/v1/seats:
    post:
      tags:
      - 空间 · 座位与标记
      summary: 登记座位（SPC-SEAT-01）
      operationId: create_seat_api_space_v1_seats_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatInfo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/space/v1/rooms/{room_id}/seats/batch:
    post:
      tags:
      - 空间 · 座位与标记
      summary: 批量生成座位（SPC-SEAT-01，P1）
      operationId: create_seats_batch_api_space_v1_rooms__room_id__seats_batch_post
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatBatchIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeatInfo'
                title: Response Create Seats Batch Api Space V1 Rooms  Room Id  Seats Batch Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/space/v1/rooms/{room_id}/seats/import:
    post:
      tags:
      - 空间 · 座位与标记
      summary: CSV 导入座位（SPC-SEAT-01，P2）
      operationId: import_seats_api_space_v1_rooms__room_id__seats_import_post
      security:
      - HTTPBearer: []
      parameters:
      - name: room_id
        in: path
        required: true
        schema:
          type: integer
          title: Room Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_import_seats_api_space_v1_rooms__room_id__seats_import_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SeatInfo'
                title: Response Import Seats Api Space V1 Rooms  Room Id  Seats Import Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/space/v1/seats/status:
    post:
      tags:
      - 空间 · 座位与标记
      summary: 停用、恢复、注销座位（SPC-SEAT-01、02）
      description: 停用在 M1 中表现为写入来源 ADMIN 的占用块；受影响预约按 BR-19 处理。
      operationId: set_seats_status_api_space_v1_seats_status_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatStatusIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpactPreview'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/space/v1/seats/tags:
    post:
      tags:
      - 空间 · 座位与标记
      summary: 批量添加、移除座位标记（SPC-TAG-01）
      operationId: set_seat_tags_api_space_v1_seats_tags_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeatTagsIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SeatInfo'
                type: array
                title: Response Set Seat Tags Api Space V1 Seats Tags Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
tags:
- name: 空间 · 查询
  description: 校区、楼宇、房间、座位（已实现）
- name: 空间 · 房间管理
  description: 任务 D-T06
- name: 空间 · 开放时间
  description: 任务 D-T07
- name: 空间 · 座位与标记
  description: 任务 D-T08
components:
  schemas:
    ApplicantType:

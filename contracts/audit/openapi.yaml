openapi: 3.1.0
info:
  title: audit API
  version: v1
paths:
  /api/audit/v1/logs:
    get:
      tags:
      - 审计
      summary: 审计查询（AUD-02）
      description: 审计记录只增不改，任何角色都不能修改或删除。
      operationId: logs_api_audit_v1_logs_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: 页码，从 1 开始
          default: 1
          title: Page
        description: 页码，从 1 开始
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: 每页条数
          default: 20
          title: Size
        description: 每页条数
      - name: actorId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Actorid
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Action
      - name: targetType
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Targettype
      - name: targetId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Targetid
      - name: dateFrom
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Datefrom
      - name: dateTo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Dateto
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_AuditLogOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
tags:
- name: 审计
  description: 任务 D-T04
components:
  schemas:
    AuditLogOut:
      properties:
        id:
          type: integer
          title: Id
        actorType:
          type: string
          title: Actortype
        actorId:
          type: string
          title: Actorid
        actorName:
          anyOf:
          - type: string
          - type: 'null'
          title: Actorname
        action:
          type: string
          title: Action
        targetType:
          type: string
          title: Targettype
        targetId:
          type: string
          title: Targetid
        before:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Before
        after:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: After
        result:
          type: string
          title: Result
        occurredAt:
          type: string
          format: date-time
          title: Occurredat
        traceId:
          anyOf:
          - type: string
          - type: 'null'
          title: Traceid
      type: object
      required:
      - id
      - actorType
      - actorId
      - actorName
      - action
      - targetType
      - targetId
      - before
      - after
      - result
      - occurredAt
      - traceId
      title: AuditLogOut
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Page_AuditLogOut_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AuditLogOut'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        page:
          type: integer
          title: Page
        size:
          type: integer
          title: Size
      type: object
      required:
      - items
      - total
      - page
      - size
      title: Page[AuditLogOut]
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      description: IAM 签发的访问令牌
      scheme: bearer
